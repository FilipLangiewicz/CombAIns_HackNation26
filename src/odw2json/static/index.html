<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odwołania2json</title>
<style>
:root {
  --bg: #f4f6fa; --panel: #fff; --line: #dde3ec; --text: #1c2536; --muted: #667085;
  --accent: #1f4eb4; --accent-soft: #e8efff; --ok: #1a7f4b; --warn: #b54708; --warn-soft: #fff4e5;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; }
header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 18px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
header h1 { font-size: 18px; margin: 0; color: var(--accent); }
header .sub { color: var(--muted); font-size: 12px; }
header .spacer { flex: 1; }
button, .btn { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 6px 12px; border-radius: 6px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
#docs { display: flex; gap: 6px; padding: 8px 18px; overflow-x: auto; background: var(--panel); border-bottom: 1px solid var(--line); min-height: 44px; align-items: center; }
#docs .empty { color: var(--muted); }
.chip { border: 1px solid var(--line); border-radius: 16px; padding: 4px 12px; white-space: nowrap; cursor: pointer; background: var(--bg); }
.chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.chip small { color: var(--muted); margin-left: 6px; font-weight: 400; }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; }
.pane { min-height: 0; overflow: auto; position: relative; }
#left { border-right: 1px solid var(--line); background: #e9edf3; }
#left iframe { width: 100%; height: 100%; border: 0; display: block; }
#right { padding: 16px 20px 40px; }
.placeholder { color: var(--muted); display: grid; place-items: center; height: 100%; text-align: center; padding: 20px; }
#drop { position: fixed; inset: 0; background: rgba(31,78,180,.12); border: 3px dashed var(--accent); display: none; place-items: center; font-size: 22px; color: var(--accent); z-index: 10; }
#drop.on { display: grid; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 14px; }
.card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; }
.badge { display: inline-block; padding: 3px 12px; border-radius: 14px; font-weight: 600; background: var(--accent-soft); color: var(--accent); font-size: 16px; }
.badge.unknown { background: var(--warn-soft); color: var(--warn); }
.note { background: var(--warn-soft); color: var(--warn); border-radius: 6px; padding: 8px 12px; margin-top: 10px; }
.scores { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.scores span { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; font-size: 12px; }
table { width: 100%; border-collapse: collapse; }
td, th { text-align: left; vertical-align: top; padding: 6px 8px; border-bottom: 1px solid var(--line); }
tr.group td { background: var(--bg); font-weight: 600; color: var(--accent); }
td.key { width: 34%; color: var(--muted); word-break: break-word; }
td.val input { width: 100%; font: inherit; padding: 4px 6px; border: 1px solid transparent; border-radius: 4px; background: transparent; }
td.val input:hover, td.val input:focus { border-color: var(--line); background: #fff; outline: none; }
td.val input.null { color: var(--muted); font-style: italic; }
td.val input.edited { border-color: var(--ok); background: #effaf3; }
.ev { display: block; margin-top: 3px; font-size: 12px; color: var(--ok); border-left: 3px solid var(--ok); padding-left: 8px; }
details summary { cursor: pointer; font-weight: 600; }
pre { background: #101828; color: #e4e9f2; padding: 12px; border-radius: 6px; overflow: auto; max-height: 420px; margin: 10px 0 0; font-size: 12px; }
.actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
.spin { color: var(--accent); padding: 4px 18px; }
@media (max-width: 800px) {
  main { grid-template-columns: 1fr; grid-template-rows: 45vh 1fr; }
  #left { border-right: 0; border-bottom: 1px solid var(--line); }
}
</style>
</head>
<body>
<header>
  <h1>Odwołania2json</h1>
  <span class="sub">Ekstrakcja danych z dokumentów spraw KIO</span>
  <span class="spacer"></span>
  <input id="file" type="file" accept="application/pdf,.pdf" multiple hidden>
  <button class="primary" id="pick">Wybierz pliki PDF</button>
</header>
<div id="docs"><span class="empty">Przeciągnij pliki PDF na stronę lub użyj przycisku.</span></div>
<main>
  <section class="pane" id="left"><div class="placeholder">Podgląd dokumentu PDF</div></section>
  <section class="pane" id="right"><div class="placeholder">Wynik analizy pojawi się tutaj.</div></section>
</main>
<div id="drop">Upuść pliki PDF, aby je przeanalizować</div>
<script>
const docs = [];
let current = null;
let pending = 0;
const $ = (id) => document.getElementById(id);

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
}

async function upload(file) {
  pending++; renderDocs();
  try {
    const resp = await fetch("/api/analyze?name=" + encodeURIComponent(file.name), {method: "POST", body: file});
    const doc = await resp.json();
    if (!resp.ok) throw new Error(doc.error || resp.status);
    doc.edited = structuredClone(doc.data);
    docs.push(doc);
    select(doc.id);
  } catch (err) {
    alert("Błąd analizy pliku " + file.name + ": " + err.message);
  } finally {
    pending--; renderDocs();
  }
}

function addFiles(files) {
  [...files].filter((f) => /\.pdf$/i.test(f.name) || f.type === "application/pdf").forEach(upload);
}

function renderDocs() {
  const box = $("docs");
  if (!docs.length && !pending) return;
  box.innerHTML = docs.map((d) =>
    `<div class="chip ${d.id === current ? "active" : ""}" data-id="${d.id}">${esc(d.name)}<small>${esc(d.type_label)}</small></div>`
  ).join("") + (pending ? `<span class="spin">Analizuję (${pending})…</span>` : "");
  box.querySelectorAll(".chip").forEach((c) => c.onclick = () => select(c.dataset.id));
}

function select(id) {
  current = id;
  const doc = docs.find((d) => d.id === id);
  $("left").innerHTML = `<iframe title="PDF" src="${doc.pdf_url}"></iframe>`;
  renderDocs();
  renderResult(doc);
}

function flatten(value, path, rows, depth) {
  if (value !== null && typeof value === "object") {
    const entries = Array.isArray(value) ? value.map((v, i) => [String(i), v]) : Object.entries(value);
    for (const [k, v] of entries) {
      const p = path ? path + "." + k : k;
      const label = Array.isArray(value) ? "#" + (Number(k) + 1) : k;
      if (v !== null && typeof v === "object") {
        rows.push({group: true, label, depth});
        flatten(v, p, rows, depth + 1);
      } else {
        rows.push({label, path: p, value: v, depth});
      }
    }
  } else {
    rows.push({label: path, path, value, depth});
  }
}

function getAt(obj, path) {
  return path.split(".").reduce((o, k) => o[k], obj);
}
function setAt(obj, path, val) {
  const keys = path.split(".");
  const last = keys.pop();
  keys.reduce((o, k) => o[k], obj)[last] = val;
}

function parseValue(text, original) {
  if (text === "") return null;
  if (typeof original === "number") {
    const n = Number(text.replace(",", "."));
    return Number.isNaN(n) ? text : n;
  }
  return text;
}

function renderResult(doc) {
  const unknown = !doc.doc_type;
  const rows = [];
  flatten(doc.data, "", rows, 0);
  let html = `<div class="card"><h2>Rozpoznany typ dokumentu</h2>
    <span class="badge ${unknown ? "unknown" : ""}">${esc(doc.type_label)}</span>`;
  if (unknown) html += `<div class="hint">Dokument nie pasuje do znanego typu. Wynik: <code>{}</code>.</div>`;
  if (doc.error) html += `<div class="note">Błąd przetwarzania: ${esc(doc.error)}</div>`;
  if (doc.ocr_missing) html += `<div class="note">Dokument nie ma warstwy tekstowej, a silnik OCR jest niedostępny.</div>`;
  else if (doc.ocr_pages.length) html += `<div class="note">Zastosowano OCR na stronach: ${doc.ocr_pages.map((p) => p + 1).join(", ")}.</div>`;
  const scores = Object.entries(doc.scores);
  if (scores.length) html += `<div class="scores">${scores.map(([k, v]) => `<span>${esc(k)}: <b>${Number(v).toFixed(1)}</b></span>`).join("")}</div>`;
  html += `</div>`;

  if (rows.length) {
    html += `<div class="card"><h2>Wyodrębnione pola</h2><table>`;
    rows.forEach((r, i) => {
      const pad = `padding-left:${8 + r.depth * 16}px`;
      if (r.group) { html += `<tr class="group"><td colspan="2" style="${pad}">${esc(r.label)}</td></tr>`; return; }
      const ev = doc.evidence[r.path];
      const shown = r.value === null ? "" : String(r.value);
      html += `<tr><td class="key" style="${pad}">${esc(r.label)}</td><td class="val">
        <input data-path="${esc(r.path)}" class="${r.value === null ? "null" : ""}" value="${esc(shown)}" placeholder="brak (null)">
        ${ev ? `<span class="ev">${esc(ev)}</span>` : ""}</td></tr>`;
    });
    html += `</table><div class="hint">Kliknij wartość, aby ją poprawić. Poprawione pola są zaznaczone na zielono.</div></div>`;
  }

  html += `<div class="card"><details open><summary>Surowy JSON</summary>
    <pre id="json"></pre>
    <div class="actions"><button class="primary" id="dl">Pobierz JSON</button><button id="copy">Kopiuj</button></div>
  </details></div>`;
  $("right").innerHTML = html;
  refreshJson(doc);

  $("right").querySelectorAll("input[data-path]").forEach((inp) => {
    inp.oninput = () => {
      const original = getAt(doc.data, inp.dataset.path);
      setAt(doc.edited, inp.dataset.path, parseValue(inp.value, original));
      inp.classList.toggle("edited", JSON.stringify(getAt(doc.edited, inp.dataset.path)) !== JSON.stringify(original));
      inp.classList.remove("null");
      refreshJson(doc);
    };
  });
  $("dl").onclick = () => {
    const blob = new Blob([jsonText(doc)], {type: "application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = doc.name.replace(/\.pdf$/i, "") + ".json";
    a.click();
    URL.revokeObjectURL(a.href);
  };
  $("copy").onclick = async () => {
    try { await navigator.clipboard.writeText(jsonText(doc)); $("copy").textContent = "Skopiowano"; }
    catch { $("copy").textContent = "Nie udało się"; }
    setTimeout(() => { $("copy").textContent = "Kopiuj"; }, 1500);
  };
}

const jsonText = (doc) => JSON.stringify(doc.edited, null, 2) + "\n";
function refreshJson(doc) { $("json").textContent = jsonText(doc); }

$("pick").onclick = () => $("file").click();
$("file").onchange = (e) => { addFiles(e.target.files); e.target.value = ""; };
let depth = 0;
addEventListener("dragenter", (e) => { e.preventDefault(); depth++; $("drop").classList.add("on"); });
addEventListener("dragleave", () => { if (--depth <= 0) { depth = 0; $("drop").classList.remove("on"); } });
addEventListener("dragover", (e) => e.preventDefault());
addEventListener("drop", (e) => { e.preventDefault(); depth = 0; $("drop").classList.remove("on"); addFiles(e.dataTransfer.files); });
</script>
</body>
</html>
