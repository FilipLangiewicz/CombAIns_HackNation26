# The appeal to the KIO (odwołanie).
name: odwolanie
label: Odwołanie do KIO
order: 1
extractor: odwolanie

classify:
  head_chars: 4000
  min_score: 5
  # A line similar to a title (80% or more) counts as the title. The OCR can change some letters.
  titles: ['ODWOŁANIE']
  title_weight: 4
  rules:
    # The title is a whole line. A wrapped line that starts with "odwołanie" is not a title.
    - {pattern: '(?-i:^\s*(?:ODWOŁANIE\b|Odwołanie\s*$))', weight: 4, where: head}
    # The title in capitals can follow other text when the PDF joins lines.
    - {pattern: '(?-i:\bODWOŁANIE\b)', weight: 3, where: head}
    - {pattern: 'Odwołując\w*', weight: 1}
    - {pattern: 'Zamawiając\w*', weight: 1}
    - {pattern: 'Krajow\w+ Izb\w+ Odwoławcz\w+', weight: 1}
    - {pattern: 'zarzut|zarzuc', weight: 1}
    # An appeal without a title in capitals: "Do: KIO", "Od:", "Przeciwko:".
    - {pattern: '^\s*Do\s*:\s*(?:Prezes\w*\s+)?Krajow\w+\s+Izb', weight: 2, where: head}
    - {pattern: '^\s*Przeciwko\s*:', weight: 2, where: head}
    - {pattern: 'Zaskarżon\w+\s+czynnoś|Przedmiot\s+odwołania', weight: 1, where: head}
    # The answer of the contracting authority and other letters also contain these words.
    - {pattern: 'odpowiedź\s+na\s+odwołanie', weight: -10, where: head}
    - {pattern: '^\s*(?:ODPOWIEDŹ|ZAWIADOMIENIE|WEZWANIE|PRZYSTĄPIENIE|STANOWISKO)\b', weight: -10, where: start}
    # The rulings of the KIO, notices and other documents also contain these words.
    - {pattern: 'Sygn\.?\s*akt', weight: -10, where: start}
    - {pattern: '^\s*(WYROK|POSTANOWIENIE|UCHWAŁA|DECYZJA)\b', weight: -10, where: start}
    - {pattern: '^\s*Ogłoszenie o zamówieniu|See the notice on TED', weight: -10, where: start}

# The OCR reads the first 3 scanned pages of each document. The data of an appeal is in its first pages,
# so the OCR stops there. If one of these fields is empty, it reads all pages. Other types: all pages.
ocr_first_pages_only: true
ocr_more_pages_if_empty:
  - OdwolanieKIO.czynnosc_powod_id
  - OdwolanieKIO.czynnosc_dzien
  - ZamowieniePubliczne.tytul
  # The name of the attorney can be only in the signature on the last page.
  - Odwolujacy[].pelnomocnik.imie_nazwisko

template:
  OdwolanieKIO: {data: null, czynnosc_dzien: null, czynnosc_powod_id: null, czynnosc_opis: null, miejscowosc: null}
  Odwolujacy: []
  Zamawiajacy: []
  ZamowieniePubliczne: {numer_bzp: null, numer_postepowania: null, numer_ted: null, tytul: null}

# The codes of the contested action. The description goes to "czynnosc_opis" without a change.
actions:
  1: Decyzja o odrzuceniu oferty
  2: Ogłoszenie wyboru oferty
  3: Decyzja o wykluczeniu wykonawcy
  4: Publikacja specyfikacji warunków zamówienia (SWZ)
  5: Modyfikacja treści SWZ
  6: Odpowiedzi/wyjaśnienia do SWZ
  7: Zaniechanie odrzucenia oferty
  8: Zaniechanie wykluczenia wykonawcy
  9: Decyzja o unieważnieniu postępowania
  10: Zaniechanie unieważnienia postępowania
  11: Opis przedmiotu zamówienia (OPZ)
  12: Projektowane postanowienia umowy

# Keyword rules for the code of the contested action. The extractor reads the text of the first
# charge and gives the code of the first rule that has a matching pattern. Order matters:
# a specific rule (a failure to act) must come before a general rule.
action_rules:
  - {code: 10, patterns: ['zaniecha\w*\s+(?:\w+\s+){0,2}unieważ', 'nie\s+unieważ']}
  - {code: 7, patterns: ['zaniecha\w*\s+(?:\w+\s+){0,2}odrzuc', 'nie\s+odrzuc']}
  - {code: 8, patterns: ['zaniecha\w*\s+(?:\w+\s+){0,2}wyklucz', 'nie\s+wyklucz']}
  - {code: 9, patterns: ['unieważ']}
  - {code: 3, patterns: ['wyklucz']}
  - {code: 1, patterns: ['odrzu(?:c|ci)']}
  - {code: 2, patterns: ['\bwybór\b', '\bwyborze\b', '\bwyboru\b', 'wybrał', 'wybrano']}
  - {code: 6, patterns: ['odpowiedz', 'wyjaśnie']}
  - {code: 5, patterns: ['zmodyfik', 'modyfikac']}
  - {code: 11, patterns: ['opis\w*\s+przedmiotu', '\bOPZ\b']}
  - {code: 12, patterns: ['projektowan\w+\s+postanowie', 'postanowie\w+\s+umow']}
  # The general rule is a fallback: a more specific object wins, also when it stands later in the text.
  - {code: 4, fallback: true, patterns: ['publik', 'opublik', 'specyfikacj', '\bSWZ\b', 'warunków zamówienia']}

# Validation of the fields (see src/odw2json/validate.py). A value that is not valid becomes null.
validate:
  - {path: "OdwolanieKIO.data", kind: date}
  - {path: "OdwolanieKIO.czynnosc_dzien", kind: date}
  - {path: "Odwolujacy[].krs", kind: digits, lengths: [10]}
  - {path: "Odwolujacy[].nip", kind: digits, lengths: [10]}
  - {path: "Odwolujacy[].regon", kind: digits, lengths: [9, 14]}
  - {path: "Odwolujacy[].pelnomocnik.mail", kind: email}
  - {path: "Zamawiajacy[].krs", kind: digits, lengths: [10]}
  - {path: "Zamawiajacy[].nip", kind: digits, lengths: [10]}
  - {path: "Zamawiajacy[].regon", kind: digits, lengths: [9, 14]}
  - {path: "ZamowieniePubliczne.numer_bzp", kind: regex, pattern: '\d{4}/BZP\d{8}(/\d{1,3})?'}
  - {path: "ZamowieniePubliczne.numer_ted", kind: regex, pattern: '\d{6}-\d{4}'}
